<!doctype html>
<html lang="zh-CN" data-theme="auto">
<head>
<meta charset="utf-8">
<title>MD 预览器</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
/* ---------- 主题变量 ---------- */
:root {
  --bg: #ffffff;
  --bg-soft: #f6f7f9;
  --bg-side: #f8f9fb;
  --fg: #1f2328;
  --fg-soft: #6a737d;
  --border: #e3e7ec;
  --border-soft: #eef1f4;
  --accent: #2f6fed;
  --accent-soft: #e8f0fe;
  --code-bg: #f6f8fa;
  --code-head: #eef1f5;
  --mark: #fff8c5;
  --shadow: 0 1px 2px rgba(16, 24, 40, .06), 0 8px 24px rgba(16, 24, 40, .04);
  --kw: #b31d6b;
  --str: #0a7d3e;
  --com: #8b949e;
  --num: #1c64d9;
  --font-ui: "Microsoft YaHei", "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "Cascadia Code", "JetBrains Mono", Consolas, "Courier New", Menlo, monospace;
  --fs: 16px;
}

html[data-theme="dark"] {
  --bg: #15171b;
  --bg-soft: #1b1e24;
  --bg-side: #131519;
  --fg: #e6e8eb;
  --fg-soft: #98a2b3;
  --border: #2a2f38;
  --border-soft: #22272f;
  --accent: #7aa7ff;
  --accent-soft: #1d2b45;
  --code-bg: #1e232b;
  --code-head: #252b34;
  --mark: #4a3f12;
  --shadow: none;
  --kw: #ff7ab2;
  --str: #7ee787;
  --com: #8b949e;
  --num: #79c0ff;
}

@media (prefers-color-scheme: dark) {
  html[data-theme="auto"] {
    --bg: #15171b;
    --bg-soft: #1b1e24;
    --bg-side: #131519;
    --fg: #e6e8eb;
    --fg-soft: #98a2b3;
    --border: #2a2f38;
    --border-soft: #22272f;
    --accent: #7aa7ff;
    --accent-soft: #1d2b45;
    --code-bg: #1e232b;
    --code-head: #252b34;
    --mark: #4a3f12;
    --shadow: none;
    --kw: #ff7ab2;
    --str: #7ee787;
    --num: #79c0ff;
  }
}

/* ---------- 基础 ---------- */
* { box-sizing: border-box; }

/* hidden 属性优先级要高于 .empty{display:flex} 之类的类规则 */
[hidden] { display: none !important; }

html, body { height: 100%; }

body {
  margin: 0;
  font-family: var(--font-ui);
  font-size: var(--fs);
  color: var(--fg);
  background: var(--bg);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}

body.dragging::after {
  content: "松开即可预览";
  position: fixed;
  inset: 12px;
  border: 2px dashed var(--accent);
  border-radius: 14px;
  background: color-mix(in srgb, var(--accent) 8%, transparent);
  color: var(--accent);
  font-size: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
  pointer-events: none;
  z-index: 999;
}

/* ---------- 顶栏 ---------- */
.topbar {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 10px 16px;
  border-bottom: 1px solid var(--border);
  background: var(--bg-soft);
}

.brand {
  display: flex;
  align-items: center;
  gap: 8px;
  font-weight: 700;
  letter-spacing: .2px;
  white-space: nowrap;
}
.brand .dot {
  width: 9px; height: 9px; border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 18%, transparent);
}

.doc-head { min-width: 0; flex: 1 1 auto; }
.doc-title {
  font-weight: 600;
  font-size: .95em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.doc-meta {
  font-size: .78em;
  color: var(--fg-soft);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  margin-top: 2px;
}

.tools { display: flex; align-items: center; gap: 6px; flex: 0 0 auto; }

.btn {
  font: inherit;
  font-size: .82em;
  color: var(--fg);
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 6px 11px;
  cursor: pointer;
  white-space: nowrap;
  transition: background .12s, border-color .12s, color .12s;
}
.btn:hover { background: var(--accent-soft); border-color: var(--accent); }
.btn:active { transform: translateY(1px); }
.btn.primary {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
  font-weight: 600;
}
.btn.primary:hover { filter: brightness(1.06); background: var(--accent); }
.btn.icon { padding: 6px 9px; min-width: 34px; }
.btn.active { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }

/* ---------- 布局 ---------- */
.layout {
  flex: 1 1 auto;
  display: flex;
  min-height: 0;
}

.sidebar {
  flex: 0 0 268px;
  display: flex;
  flex-direction: column;
  min-height: 0;
  border-right: 1px solid var(--border);
  background: var(--bg-side);
}

.panel { display: flex; flex-direction: column; min-height: 0; padding: 10px 10px 6px; }
.panel.grow { flex: 1 1 auto; border-top: 1px solid var(--border-soft); }
.panel-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: .76em;
  font-weight: 700;
  letter-spacing: .6px;
  text-transform: uppercase;
  color: var(--fg-soft);
  padding: 0 6px 8px;
}
.panel-head .count {
  background: var(--bg-soft);
  border: 1px solid var(--border-soft);
  border-radius: 999px;
  padding: 0 7px;
  font-size: .92em;
}

.filter {
  font: inherit;
  font-size: .8em;
  width: 100%;
  padding: 6px 9px;
  margin-bottom: 8px;
  color: var(--fg);
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  outline: none;
}
.filter:focus { border-color: var(--accent); }

.file-list { overflow: auto; min-height: 60px; max-height: 38vh; }
.file-item {
  display: flex;
  align-items: baseline;
  gap: 8px;
  width: 100%;
  text-align: left;
  font: inherit;
  font-size: .82em;
  color: var(--fg);
  background: none;
  border: 0;
  border-radius: 7px;
  padding: 6px 8px;
  cursor: pointer;
  overflow: hidden;
}
.file-item:hover { background: var(--bg-soft); }
.file-item.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.file-item .fname { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.file-item .fdir {
  margin-left: auto;
  font-size: .86em;
  color: var(--fg-soft);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 45%;
}

.outline { overflow: auto; flex: 1 1 auto; padding-bottom: 10px; }
.outline-item {
  display: block;
  width: 100%;
  text-align: left;
  font: inherit;
  font-size: .8em;
  color: var(--fg-soft);
  background: none;
  border: 0;
  border-left: 2px solid transparent;
  padding: 4px 8px;
  cursor: pointer;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.outline-item:hover { color: var(--fg); background: var(--bg-soft); }
.outline-item.lv2 { padding-left: 20px; }
.outline-item.lv3 { padding-left: 32px; }
.outline-item.lv4, .outline-item.lv5, .outline-item.lv6 { padding-left: 44px; font-size: .76em; }
.outline-item.active { color: var(--accent); border-left-color: var(--accent); background: var(--accent-soft); }

.outline-empty {
  padding: 6px 10px;
  font-size: .78em;
  color: var(--fg-soft);
  opacity: .8;
}

.markdown-body img.img-missing {
  display: inline-block;
  min-width: 120px;
  min-height: 40px;
  padding: 10px;
  border: 1px dashed var(--border);
  background: var(--bg-soft);
  color: var(--fg-soft);
  font-size: .78em;
  font-style: italic;
}
.markdown-body img.img-missing::after { content: "（图片未找到）"; }

.content {
  flex: 1 1 auto;
  min-width: 0;
  overflow: auto;
  scroll-behavior: smooth;
}

/* ---------- 空状态 ---------- */
.empty {
  min-height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 40px 24px;
}
.empty-card {
  max-width: 560px;
  text-align: center;
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 34px 30px 26px;
  background: var(--bg-soft);
  box-shadow: var(--shadow);
}
.empty-icon {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 64px; height: 64px;
  border-radius: 16px;
  background: var(--accent);
  color: #fff;
  font-family: var(--font-mono);
  font-weight: 700;
  font-size: 20px;
  margin-bottom: 16px;
}
.empty-card h2 { margin: 0 0 10px; font-size: 1.2em; }
.empty-card > p { margin: 0 0 18px; color: var(--fg-soft); font-size: .9em; line-height: 1.7; }
.empty-actions { display: flex; gap: 10px; justify-content: center; margin-bottom: 20px; }
.tips {
  list-style: none;
  margin: 0;
  padding: 16px 0 0;
  border-top: 1px dashed var(--border);
  text-align: left;
  font-size: .8em;
  color: var(--fg-soft);
  line-height: 1.9;
}
.tips li::before { content: "·"; margin-right: 6px; color: var(--accent); }
kbd {
  font-family: var(--font-mono);
  font-size: .92em;
  background: var(--bg);
  border: 1px solid var(--border);
  border-bottom-width: 2px;
  border-radius: 5px;
  padding: 1px 5px;
}

/* ---------- Markdown 正文 ---------- */
.markdown-body {
  max-width: 860px;
  margin: 0 auto;
  padding: 36px 40px 120px;
  line-height: 1.78;
  word-wrap: break-word;
  overflow-wrap: break-word;
}

.markdown-body > :first-child { margin-top: 0; }

.markdown-body h1,
.markdown-body h2,
.markdown-body h3,
.markdown-body h4,
.markdown-body h5,
.markdown-body h6 {
  margin: 1.6em 0 .7em;
  font-weight: 700;
  line-height: 1.35;
  scroll-margin-top: 16px;
}
.markdown-body h1 { font-size: 1.85em; padding-bottom: .3em; border-bottom: 1px solid var(--border); }
.markdown-body h2 { font-size: 1.45em; padding-bottom: .25em; border-bottom: 1px solid var(--border-soft); }
.markdown-body h3 { font-size: 1.2em; }
.markdown-body h4 { font-size: 1.05em; }
.markdown-body h5, .markdown-body h6 { font-size: .98em; color: var(--fg-soft); }

.markdown-body p { margin: .85em 0; }

.markdown-body a { color: var(--accent); text-decoration: none; border-bottom: 1px solid color-mix(in srgb, var(--accent) 35%, transparent); }
.markdown-body a:hover { border-bottom-color: var(--accent); }

.markdown-body strong { font-weight: 700; }
.markdown-body em { font-style: italic; }
.markdown-body del { color: var(--fg-soft); }
.markdown-body mark { background: var(--mark); color: inherit; padding: 0 2px; border-radius: 3px; }

.markdown-body ul,
.markdown-body ol { margin: .7em 0; padding-left: 1.6em; }
.markdown-body li { margin: .25em 0; }
.markdown-body li > ul,
.markdown-body li > ol { margin: .25em 0; }
.markdown-body ul.loose > li,
.markdown-body ol.loose > li { margin: .5em 0; }

.markdown-body blockquote {
  margin: 1em 0;
  padding: .2em 1em;
  color: var(--fg-soft);
  border-left: 4px solid color-mix(in srgb, var(--accent) 40%, var(--border));
  background: var(--bg-soft);
  border-radius: 0 8px 8px 0;
}
.markdown-body blockquote > :first-child { margin-top: .5em; }
.markdown-body blockquote > :last-child { margin-bottom: .5em; }

.markdown-body hr {
  border: 0;
  border-top: 1px solid var(--border);
  margin: 2em 0;
}

.markdown-body code {
  font-family: var(--font-mono);
  font-size: .88em;
  background: var(--code-bg);
  border: 1px solid var(--border-soft);
  border-radius: 5px;
  padding: .12em .38em;
}

.markdown-body .code-block {
  margin: 1.1em 0;
  border: 1px solid var(--border);
  border-radius: 10px;
  overflow: hidden;
  background: var(--code-bg);
}
.markdown-body .code-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 5px 10px;
  font-size: .74em;
  color: var(--fg-soft);
  background: var(--code-head);
  border-bottom: 1px solid var(--border-soft);
  font-family: var(--font-mono);
}
.markdown-body .code-copy {
  font: inherit;
  font-size: .95em;
  color: var(--fg-soft);
  background: transparent;
  border: 1px solid transparent;
  border-radius: 6px;
  padding: 1px 8px;
  cursor: pointer;
  opacity: .75;
}
.markdown-body .code-copy:hover { opacity: 1; border-color: var(--border); color: var(--fg); }
.markdown-body pre {
  margin: 0;
  padding: 14px 16px;
  overflow: auto;
  font-size: .88em;
  line-height: 1.65;
}
.markdown-body pre code {
  background: none;
  border: 0;
  padding: 0;
  font-size: 1em;
  white-space: pre;
}

.tok-kw { color: var(--kw); font-weight: 600; }
.tok-str { color: var(--str); }
.tok-com { color: var(--com); font-style: italic; }
.tok-num { color: var(--num); }

.markdown-body .table-wrap { overflow-x: auto; margin: 1.1em 0; }
.markdown-body table {
  border-collapse: collapse;
  width: auto;
  min-width: 50%;
  font-size: .92em;
}
.markdown-body th,
.markdown-body td {
  border: 1px solid var(--border);
  padding: 7px 12px;
  text-align: left;
  vertical-align: top;
}
.markdown-body th { background: var(--bg-soft); font-weight: 600; white-space: nowrap; }
.markdown-body tbody tr:nth-child(2n) { background: color-mix(in srgb, var(--bg-soft) 60%, transparent); }

.markdown-body img {
  max-width: 100%;
  height: auto;
  border-radius: 8px;
  border: 1px solid var(--border-soft);
}

.markdown-body label.task {
  display: flex;
  align-items: baseline;
  gap: 8px;
}
.markdown-body li.task-item { list-style: none; }
.markdown-body li.task-item > label.task { display: inline-flex; }
.markdown-body label.task input { margin: 0; accent-color: var(--accent); }
.markdown-body label.task > span > p { margin: 0; }

/* ---------- 源码视图 ---------- */
#viewer.source-view {
  max-width: 1000px;
  margin: 0 auto;
  padding: 28px 32px 120px;
  font-family: var(--font-mono);
  font-size: .88em;
  line-height: 1.75;
  white-space: pre-wrap;
  word-break: break-word;
  color: var(--fg);
  background: var(--code-bg);
  border-left: 1px solid var(--border-soft);
  border-right: 1px solid var(--border-soft);
}

/* ---------- 提示 ---------- */
.toast {
  position: fixed;
  left: 50%;
  bottom: 28px;
  transform: translateX(-50%) translateY(20px);
  background: var(--fg);
  color: var(--bg);
  font-size: .82em;
  padding: 9px 18px;
  border-radius: 999px;
  opacity: 0;
  transition: opacity .18s, transform .18s;
  pointer-events: none;
  z-index: 1000;
  white-space: nowrap;
}
.toast.show { opacity: .94; transform: translateX(-50%) translateY(0); }

/* ---------- 窄屏 ---------- */
@media (max-width: 860px) {
  .sidebar { display: none; }
  .markdown-body { padding: 22px 18px 90px; }
  .doc-meta { display: none; }
  .topbar { gap: 10px; padding: 8px 10px; }
  .btn { padding: 6px 8px; }
}

/* ---------- 打印 ---------- */
@media print {
  :root, html[data-theme="dark"], html[data-theme="auto"] {
    --bg: #fff; --fg: #000; --fg-soft: #444; --border: #ccc; --border-soft: #ddd;
    --code-bg: #f7f7f7; --code-head: #eee; --mark: #fff8c5; --accent: #000;
  }
  body { overflow: visible; display: block; background: #fff; }
  .topbar, .sidebar, .toast, .code-copy { display: none !important; }
  .layout, .content { display: block; overflow: visible; height: auto; }
  .markdown-body { max-width: none; padding: 0; }
  .markdown-body a { color: #000; border-bottom: 0; }
  .markdown-body pre, .markdown-body table { break-inside: avoid; }
  .markdown-body h1, .markdown-body h2, .markdown-body h3 { break-after: avoid; }
}

</style>
</head>
<body>

<header class="topbar">
  <div class="brand"><span class="dot"></span>MD 预览器</div>
  <div class="doc-head">
    <div id="doc-title" class="doc-title">未打开文件</div>
    <div id="doc-meta" class="doc-meta">把 .md 文件拖进来，或点击「打开文件」</div>
  </div>
  <div class="tools">
    <button id="btn-open" class="btn primary" type="button">打开文件</button>
    <button id="btn-folder" class="btn" type="button">打开文件夹</button>
    <button id="btn-theme" class="btn icon" type="button" title="切换主题（浅色 / 深色 / 跟随系统）">◐</button>
    <button id="btn-source" class="btn icon" type="button" title="源码 / 预览（Ctrl+E）">&#8249;&#8250;</button>
    <button id="btn-font-dec" class="btn icon" type="button" title="缩小字号（Ctrl+-）">A-</button>
    <button id="btn-font-inc" class="btn icon" type="button" title="放大字号（Ctrl+=）">A+</button>
    <button id="btn-print" class="btn" type="button" title="打印 / 另存为 PDF（Ctrl+P）">打印</button>
  </div>
</header>

<main class="layout">
  <aside id="sidebar" class="sidebar">
    <div class="panel">
      <div class="panel-head"><span>文件</span><span id="file-count" class="count">0</span></div>
      <input id="file-filter" class="filter" type="search" placeholder="筛选文件…" autocomplete="off">
      <div id="file-list" class="file-list"></div>
    </div>
    <div class="panel grow">
      <div class="panel-head"><span>大纲</span></div>
      <div id="outline" class="outline"></div>
    </div>
  </aside>

  <section id="content" class="content">
    <article id="viewer" class="markdown-body" hidden></article>
    <div id="empty" class="empty">
      <div class="empty-card">
        <div class="empty-icon">.md</div>
        <h2>把 Markdown 文件拖进来</h2>
        <p>单个文件、多个文件、整个文件夹都可以。支持 .md / .markdown / .txt。</p>
        <div class="empty-actions">
          <button id="btn-open2" class="btn primary" type="button">选择文件</button>
          <button id="btn-folder2" class="btn" type="button">选择文件夹</button>
        </div>
        <ul class="tips">
          <li><kbd>Ctrl</kbd>+<kbd>O</kbd> 打开文件，<kbd>Ctrl</kbd>+<kbd>E</kbd> 切换源码</li>
          <li>从文件夹打开时，相对路径引用的图片会自动显示</li>
          <li><kbd>Ctrl</kbd>+<kbd>P</kbd> 打印 / 另存为 PDF，只输出正文</li>
        </ul>
      </div>
    </div>
  </section>
</main>

<input id="file-input" type="file" multiple accept=".md,.markdown,.mdown,.mkd,.txt" hidden>
<input id="dir-input" type="file" webkitdirectory directory multiple hidden>

<script>
/*! md.js —— 零依赖 Markdown → HTML 渲染器（GFM 常用子集）
 *  支持：ATX/Setext 标题、段落、粗体/斜体/删除线、行内代码、围栏代码块（带简易高亮）、
 *        有序/无序/嵌套列表、任务列表、引用、表格、分隔线、链接、图片、自动链接、转义。
 *  用法：MD.parse(src) -> { html, toc:[{level,text,id}] }；浏览器下挂到 window.MD。
 */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) { module.exports = factory(); }
  else { root.MD = factory(); }
}(typeof globalThis !== 'undefined' ? globalThis : this, function () {
  'use strict';

  /* ---------- 基础工具 ---------- */

  var ESC_MAP = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return ESC_MAP[c]; });
  }
  function pad(str) { var n = 0; while (n < str.length && str.charCodeAt(n) === 32) { n++; } return n; }
  function dirOf(p) { return String(p || '').replace(/[^/\\]*$/, ''); }
  function baseName(p) { return String(p || '').replace(/^.*[\\/]/, ''); }

  var CJK_RE = /[\u2E80-\u9FFF\uF900-\uFAFF\uFF00-\uFFEF]/;
  var RE_LIST = /^( {0,3})([-*+]|\d{1,9}[.)])( +)(.*)$/;
  var RE_FENCE = /^ {0,3}(`{3,}|~{3,})[ \t]*([^`~]*)$/;
  var RE_HR = /^ {0,3}([-*_])[ \t]*(?:\1[ \t]*){2,}[ \t]*$/;
  var RE_ATX = /^ {0,3}(#{1,6})[ \t]+(.*?)[ \t]*#*[ \t]*$/;
  var RE_SETEXT = /^ {0,3}(=+|-+)[ \t]*$/;
  var RE_BQ = /^ {0,3}>/;
  var RE_BQ_STRIP = /^ {0,3}>[ ]?/;

  /* ---------- 代码高亮（轻量，够看即可） ---------- */

  var KW = {
    js: 'async await break case catch class const continue debugger default delete do else export extends finally for from function if import in instanceof let new of return static super switch this throw try typeof var void while with yield null undefined true false',
    ts: 'abstract any as async await break case catch class const continue declare default delete do else enum export extends finally for from function if implements import in instanceof interface let new of private protected public readonly return static super switch this throw try type typeof var void while yield null undefined true false',
    py: 'and as assert async await break class continue def del elif else except False finally for from global if import in is lambda None nonlocal not or pass raise return True try while with yield print self',
    bash: 'if then else elif fi for while do done case esac function in local return exit export echo cd source alias set unset readonly',
    json: 'true false null',
    go: 'break case chan const continue default defer else fallthrough for func go goto if import interface map package range return select struct switch type var nil true false',
    rust: 'as async await break const continue crate dyn else enum extern false fn for if impl in let loop match mod move mut pub ref return self static struct super trait true type unsafe use where while',
    java: 'abstract assert boolean break byte case catch char class const continue default do double else enum extends final finally float for if implements import instanceof int interface long native new package private protected public return short static super switch synchronized this throw throws transient try void volatile while true false null',
    c: 'auto break case char const continue default do double else enum extern float for goto if inline int long register restrict return short signed sizeof static struct switch typedef union unsigned void volatile while true false NULL'
  };
  var LANG_ALIAS = {
    js: 'js', javascript: 'js', mjs: 'js', cjs: 'js', jsx: 'js',
    ts: 'ts', typescript: 'ts', tsx: 'ts',
    py: 'py', python: 'py',
    sh: 'bash', bash: 'bash', shell: 'bash', zsh: 'bash', console: 'bash', powershell: 'bash', ps1: 'bash',
    json: 'json', jsonc: 'json', go: 'go', golang: 'go', rust: 'rust', rs: 'rust',
    java: 'java', kotlin: 'java', kt: 'java', scala: 'java', cs: 'java', csharp: 'java', 'c#': 'java',
    c: 'c', h: 'c', cpp: 'c', 'c++': 'c', cc: 'c', hpp: 'c', objc: 'c',
    sql: 'sql', mysql: 'sql', pgsql: 'sql'
  };
  var HASH_COMMENT_LANG = { bash: 1, py: 1 };

  function highlight(code, lang) {
    var key = LANG_ALIAS[String(lang || '').toLowerCase()] || '';
    var h = escapeHtml(code);
    var store = [];
    function tok(html) { store.push(html); return '\u0000' + (store.length - 1) + '\u0000'; }

    h = h.replace(/("(?:[^"\\\n]|\\.)*"|'(?:[^'\\\n]|\\.)*'|`(?:[^`\\]|\\.)*`)/g, function (m) {
      return tok('<span class="tok-str">' + m + '</span>');
    });

    var commentRe = HASH_COMMENT_LANG[key]
      ? /(#[^\n]*|\/\*[\s\S]*?\*\/)/
      : /(\/\/[^\n]*|\/\*[\s\S]*?\*\/|--[^\n]*)/;

    h = h.replace(/\b(0[xX][0-9a-fA-F]+|\d+(?:\.\d+)?(?:[eE][+-]?\d+)?)\b/g, function (m) {
      return tok('<span class="tok-num">' + m + '</span>');

    var kws = KW[key];

      var re = new RegExp('\\b(' + kws.split(' ').join('|') + ')\\b', 'g');

    }

    var guard = 0;
    while (h.indexOf('\u0000') >= 0 && guard++ < 300) {
      h = h.replace(/\u0000(\d+)\u0000/g, function (m, n) {
        var v = store[+n];
        return v == null ? m : v;
      });
    }
    return h;
  }

  /* ---------- 行内渲染 ---------- */

  function inline(text) {
    if (text == null) return '';
    var store = [];
    function tok(html) { store.push(html); return '\u0000' + (store.length - 1) + '\u0000'; }

    var s = String(text);

    // 反斜杠转义
    s = s.replace(/\\([\\`*_{}\[\]()#+\-.!>~|])/g, function (m, ch) { return tok(escapeHtml(ch)); });

    // 行内代码
    s = s.replace(/(`+)([\s\S]*?)\1/g, function (m, ticks, code) {
      var c = code;
      if (c.length > 2 && c.charCodeAt(0) === 32 && c.charCodeAt(c.length - 1) === 32 && c.trim() !== '') {

    // 图片
    s = s.replace(/!\[([^\]]*)\]\(\s*([^)\s]+)(?:\s+"([^"]*)")?\s*\)/g, function (m, alt, src, title) {
      return tok('<img src="' + escapeHtml(src) + '" alt="' + escapeHtml(alt) + '"' +
        (title ? ' title="' + escapeHtml(title) + '"' : '') + ' loading="lazy">');
    });

    // 链接
    s = s.replace(/\[([^\]]+)\]\(\s*([^)\s]+)(?:\s+"([^"]*)")?\s*\)/g, function (m, txt, href, title) {

        (title ? ' title="' + escapeHtml(title) + '"' : '') +
        (ext ? ' target="_blank" rel="noopener noreferrer"' : '') + '>' + inline(txt) + '</a>');
    });

    // 自动链接 <https://...>
    s = s.replace(/<((?:https?:\/\/|mailto:)[^>\s]+)>/g, function (m, url) {
      return tok('<a href="' + escapeHtml(url) + '" target="_blank" rel="noopener noreferrer">' + escapeHtml(url) + '</a>');

    // 其余文本做 HTML 转义（token 中的 \u0000 不受影响）
    s = escapeHtml(s);

    // 强调
    s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
    s = s.replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>');
    s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
    s = s.replace(/(^|[^\w*])\*([^*\n]+)\*(?=[^\w*]|$)/g, '$1<em>$2</em>');

    // 还原 token
    var guard = 0;
    while (s.indexOf('\u0000') >= 0 && guard++ < 300) {
      s = s.replace(/\u0000(\d+)\u0000/g, function (m, n) {
        var v = store[+n];
        return v == null ? m : v;
      });

  /* ---------- 块级渲染 ---------- */

  function slugify(text, seen) {
    var base = String(text).toLowerCase()
      .replace(/[^\p{L}\p{N}\s-]/gu, '')

  function heading(level, text, ctx) {
    var plain = String(text)
      .replace(/!?\[([^\]]*)\]\([^)]*\)/g, '$1')
      .replace(/[`*_~]/g, '')

  function codeBlock(code, lang) {

    return '<div class="code-block">' +
      '<div class="code-head"><span class="code-lang">' + escapeHtml(label) + '</span>' +
      '<button class="code-copy" type="button" title="复制代码">复制</button></div>' +

  function isTableSep(line) {

  function splitRow(line) {
    var s = String(line).trim();
    if (s.charAt(0) === '|') { s = s.slice(1); }

  function tableBlock(lines, start, out) {
    var head = splitRow(lines[start]);

    var aligns = sep.map(function (c) {

    html += '</tr></thead><tbody>';
    body.forEach(function (row) {
      html += '<tr>';
      for (var k = 0; k < head.length; k++) {

  function isBlockStart(line) {

  /* 列表：先按基准缩进切分同级项，再把每一项的内容递归渲染 */
  function listBlock(lines, start, ctx, out) {
    var first = RE_LIST.exec(lines[start]);
    var base = pad(first[1]);
    var ordered = /\d/.test(first[2]);
    var startNo = ordered ? parseInt(first[2], 10) : 0;
    var items = [];
    var loose = false;
    var i = start;

    while (i < lines.length) {
      var m = RE_LIST.exec(lines[i]);
      if (!m || pad(m[1]) !== base || /\d/.test(m[2]) !== ordered) { break; }
      var contentIndent = base + m[2].length + m[3].length;
      var itemLines = [m[4]];
      i++;

      while (i < lines.length) {
        var l = lines[i];
        if (/^\s*$/.test(l)) {
          var j = i;

          if (j >= lines.length) { i = j; break; }
          var nm = RE_LIST.exec(lines[j]);
          if (nm && pad(nm[1]) === base) {

            break;

          if (pad(lines[j]) >= contentIndent || (nm && pad(nm[1]) > base)) {     // 项内空行块
            for (var b = i; b < j; b++) { itemLines.push(''); }
            loose = true; i = j; continue;
          }
          i = j; break;
        }
        var ind = pad(l);
        var lm = RE_LIST.exec(l);
        if (ind >= contentIndent) { itemLines.push(l.slice(contentIndent)); i++; continue; }
        if (ind > base && !lm && !isBlockStart(l)) { itemLines.push(l.slice(Math.min(ind, contentIndent))); i++; continue; }
        break;
      }
      items.push(itemLines);
    }

    var tag = ordered ? 'ol' : 'ul';
    var startAttr = ordered && startNo > 1 ? ' start="' + startNo + '"' : '';
    var html = '<' + tag + startAttr + (loose ? ' class="loose"' : '') + '>';
    items.forEach(function (ils) {
      var firstLine = ils[0] || '';
      var task = /^\[([ xX])\][ \t]+/.exec(firstLine);
      var inner;
      var liClass = '';
      if (task) {
        ils[0] = firstLine.slice(task[0].length);
        inner = renderBlocks(ils, ctx);
        inner = inner.replace(/^<p>([\s\S]*?)<\/p>/, '$1');
        inner = '<label class="task"><input type="checkbox" disabled' +
          (task[1].toLowerCase() === 'x' ? ' checked' : '') + '><span>' + inner + '</span></label>';
        liClass = ' class="task-item"';
      } else {
        inner = renderBlocks(ils, ctx);
        if (!loose) { inner = inner.replace(/^<p>([\s\S]*?)<\/p>/, '$1'); }
      }
      html += '<li' + liClass + '>' + inner + '</li>';
    });
    html += '</' + tag + '>';
    out.push(html);
    return i;
  }

  function renderBlocks(lines, ctx) {
    var out = [];
    var para = [];
    var i = 0;

    function flush() {
      if (!para.length) { return; }
      out.push('<p>' + inline(para.join('\n')) + '</p>');
      para = [];

    while (i < lines.length) {
      var line = lines[i];

      // 围栏代码块

        var fenceLen = fm[1].length;

        var closeRe = new RegExp('^ {0,3}' + (fenceChar === '`' ? '`' : '~') + '{' + fenceLen + ',}[ \\t]*$');
        var buf = [];
        i++;
        while (i < lines.length && !closeRe.test(lines[i])) { buf.push(lines[i]); i++; }
        if (i < lines.length) { i++; }
        out.push(codeBlock(buf.join('\n'), lang));
        continue;
      }

      // ATX 标题
      var hm = RE_ATX.exec(line);
      if (hm && hm[2].trim() !== '') {
        flush();
        out.push(heading(hm[1].length, hm[2].trim(), ctx));
        i++;
        continue;
      }

      // Setext 标题（前一段累积成标题）
      if (para.length && RE_SETEXT.test(line)) {
        var lvl = line.trim().charAt(0) === '=' ? 1 : 2;
        var title = para.join(' ');
        para = [];
        out.push(heading(lvl, title, ctx));
        i++;
        continue;
      }

      // 分隔线
      if (RE_HR.test(line)) { flush(); out.push('<hr>'); i++; continue; }

      // 引用
      if (RE_BQ.test(line)) {
        flush();
        var q = [];
        while (i < lines.length && RE_BQ.test(lines[i])) {
          q.push(lines[i].replace(RE_BQ_STRIP, ''));
          i++;
        }
        out.push('<blockquote>' + renderBlocks(q, ctx) + '</blockquote>');
        continue;
      }

      // 表格
      if (line.indexOf('|') >= 0 && i + 1 < lines.length && isTableSep(lines[i + 1])) {
        flush();
        i = tableBlock(lines, i, out);
        continue;
      }

      // 列表
      if (RE_LIST.test(line)) {
        flush();
        i = listBlock(lines, i, ctx, out);
        continue;
      }

      // 缩进代码块
      if (/^ {4,}/.test(line)) {
        flush();
        var code = [];
        while (i < lines.length) {
          if (/^ {4,}/.test(lines[i])) { code.push(lines[i].slice(4)); i++; continue; }
          if (/^\s*$/.test(lines[i])) {
            var k = i;
            while (k < lines.length && /^\s*$/.test(lines[k])) { k++; }
            if (k < lines.length && /^ {4,}/.test(lines[k])) {
              for (var b = i; b < k; b++) { code.push(''); }
              i = k;
              continue;
            }
          }
          break;
        }
        while (code.length && code[code.length - 1].trim() === '') { code.pop(); }
        out.push(codeBlock(code.join('\n'), ''));
        continue;
      }

      para.push(line);
      i++;
    }
    flush();
    return out.join('\n');
  }

  /* ---------- 对外接口 ---------- */

  function parse(src) {
    var text = String(src == null ? '' : src)
      .replace(/\r\n?/g, '\n')
      .replace(/^\uFEFF/, '')
      .replace(/\t/g, '    ');

    return { html: html, toc: ctx.toc };
  }

  return { parse: parse, escapeHtml: escapeHtml, dirOf: dirOf, baseName: baseName };

<script>
/* app.js —— MD 预览器的界面逻辑：打开 / 拖放 / 大纲 / 主题 / 字号 / 源码 / 打印 */
(function () {
  'use strict';

  var MD_EXT = /\.(md|markdown|mdown|mkd|txt)$/i;
  var IMG_EXT = /\.(png|jpe?g|gif|webp|svg|bmp|avif|ico)$/i;
  var K_THEME = 'mdv.theme';
  var K_FONT = 'mdv.font';
  var K_SOURCE = 'mdv.source';

  var state = {
    docs: [],
    current: -1,
    imageMap: new Map(),
    heads: [],
    filter: '',
    theme: 'auto',
    fontSize: 16,
    showSource: false,
    loading: false
  };

  var el = {};
  var toastTimer = null;

  function $(sel) { return document.querySelector(sel); }

  /* ---------- 小工具 ---------- */

  function say(msg) {
    if (!el.toast) { return; }
    el.toast.textContent = msg;
    el.toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.toast.classList.remove('show'); }, 2200);
  }

  function normalizePath(p) {
    return String(p || '')
      .replace(/\\/g, '/')
      .replace(/^\.\//, '')
      .replace(/\/{2,}/g, '/')
      .toLowerCase();
  }

  function formatSize(n) {
    if (!n && n !== 0) { return ''; }
    if (n < 1024) { return n + ' B'; }
    if (n < 1024 * 1024) { return (n / 1024).toFixed(1) + ' KB'; }
    return (n / 1024 / 1024).toFixed(1) + ' MB';
  }

  function dirOf(p) {
    var s = String(p || '').replace(/\\/g, '/');
    var i = s.lastIndexOf('/');
    return i > 0 ? s.slice(0, i + 1) : '';
  }

  /* ---------- 主题 / 字号 ---------- */

  function applyTheme(theme) {
    state.theme = theme;
    document.documentElement.setAttribute('data-theme', theme);
    if (el.themeBtn) {
      var label = theme === 'auto' ? '跟随系统' : theme === 'dark' ? '深色' : '浅色';
      el.themeBtn.title = '当前：' + label + '（点击切换）';
      el.themeBtn.textContent = theme === 'auto' ? '\u25D0' : theme === 'dark' ? '\u263E' : '\u2600';
    }
    try { localStorage.setItem(K_THEME, theme); } catch (e) {}
  }

  function applyFontSize(px) {
    state.fontSize = Math.max(12, Math.min(26, px));
    document.documentElement.style.setProperty('--fs', state.fontSize + 'px');
    try { localStorage.setItem(K_FONT, String(state.fontSize)); } catch (e) {}
  }

  /* ---------- 文件加载 ---------- */

  function registerImage(path, file) {
    var key = normalizePath(path);
    if (!key) { return; }
    state.imageMap.set(key, file);
    var base = key.split('/').pop();
    if (base) {
      var bk = '@' + base;
      if (!state.imageMap.has(bk)) { state.imageMap.set(bk, file); }
    }
  }

  function addItems(items) {
    var added = 0;
    var skipped = 0;
    items.forEach(function (item) {
      var file = item.file;
      if (!file) { return; }
      if (IMG_EXT.test(file.name)) { registerImage(item.path, file); return; }
      if (!MD_EXT.test(file.name)) { skipped++; return; }
      if (state.docs.some(function (d) { return d.path === item.path && d.size === file.size; })) { return; }
      state.docs.push({
        name: file.name,
        path: item.path || file.name,
        size: file.size,
        file: file,
        text: null
      });
      added++;
    });

    state.docs.sort(function (a, b) { return a.path.localeCompare(b.path, 'zh'); });
    renderFileList();

    if (added > 0) {
      say('已加载 ' + added + ' 个 Markdown 文件');
      var firstNew = state.docs.findIndex(function (d) { return d.text === null && d.opened !== true; });
      selectDoc(state.current >= 0 ? state.current : (firstNew >= 0 ? firstNew : 0));
    } else if (skipped > 0) {
      say('没有找到 .md 文件（已忽略 ' + skipped + ' 个其他文件）');
      updateEmptyState();
    }
  }

  function itemsFromInput(fileList) {
    return Array.prototype.map.call(fileList, function (f) {
      return { file: f, path: f.webkitRelativePath || f.name };
    });
  }

  function itemsFromDrop(dataTransfer) {
    var items = dataTransfer.items;
    if (items && items.length && items[0].webkitGetAsEntry) {
      var tasks = [];
      for (var i = 0; i < items.length; i++) {
        var entry = items[i].webkitGetAsEntry();
        if (entry) { tasks.push(walkEntry(entry, '')); }
      }
      return Promise.all(tasks).then(function (groups) {
        return [].concat.apply([], groups);
      });
    }
    return Promise.resolve(Array.prototype.map.call(dataTransfer.files, function (f) {
      return { file: f, path: f.name };
    }));
  }

  function walkEntry(entry, prefix) {
    return new Promise(function (resolve) {
      if (entry.isFile) {
        entry.file(function (f) { resolve([{ file: f, path: prefix + f.name }]); },
          function () { resolve([]); });
        return;
      }
      if (!entry.isDirectory) { resolve([]); return; }
      var reader = entry.createReader();
      var all = [];
      function readBatch() {
        reader.readEntries(function (entries) {
          if (!entries.length) {
            var sub = all.map(function (e) { return walkEntry(e, prefix + entry.name + '/'); });
            Promise.all(sub).then(function (groups) {
              resolve([].concat.apply([], groups));
            });
            return;
          }
          all = all.concat(Array.prototype.slice.call(entries));
          readBatch();
        }, function () { resolve([]); });
      }
      readBatch();
    });
  }

  /* ---------- 文件列表 ---------- */

  function visibleDocs() {
    var q = state.filter.trim().toLowerCase();
    if (!q) { return state.docs; }
    return state.docs.filter(function (d) { return d.path.toLowerCase().indexOf(q) >= 0; });
  }

  function renderFileList() {
    var list = visibleDocs();
    el.fileCount.textContent = String(state.docs.length);
    el.fileList.textContent = '';

    if (!state.docs.length) {
      var hint = document.createElement('div');
      hint.className = 'outline-empty';
      hint.textContent = '还没有打开文件';
      el.fileList.appendChild(hint);
      return;
    }
    if (!list.length) {
      var none = document.createElement('div');
      none.className = 'outline-empty';
      none.textContent = '没有匹配的文件';
      el.fileList.appendChild(none);
      return;
    }

    list.forEach(function (doc) {
      var idx = state.docs.indexOf(doc);
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'file-item' + (idx === state.current ? ' active' : '');
      btn.title = doc.path;
      var name = document.createElement('span');
      name.className = 'fname';
      name.textContent = doc.name;
      btn.appendChild(name);
      var dir = dirOf(doc.path);
      if (dir) {
        var d = document.createElement('span');
        d.className = 'fdir';
        d.textContent = dir.replace(/\/$/, '');
        btn.appendChild(d);
      }
      btn.addEventListener('click', function () { selectDoc(idx); });
      el.fileList.appendChild(btn);
    });
  }

  /* ---------- 渲染文档 ---------- */

  function selectDoc(idx) {
    if (idx < 0 || idx >= state.docs.length) { return; }
    state.current = idx;
    renderFileList();
    loadAndRender(state.docs[idx]);
  }

  function loadAndRender(doc) {
    updateEmptyState();
    if (doc.text !== null) { doRender(doc); return; }
    el.docTitle.textContent = doc.name;
    el.docMeta.textContent = '正在读取…';
    doc.file.text().then(function (text) {
      doc.text = text;
      doc.opened = true;
      if (state.docs[state.current] === doc) { doRender(doc); }
    }).catch(function (err) {
      el.docMeta.textContent = '读取失败：' + (err && err.message ? err.message : '未知错误');
      say('读取失败：' + doc.name);
    });
  }

  function doRender(doc) {
    var res = MD.parse(doc.text);
    state.heads = [];

    if (state.showSource) {
      el.viewer.className = 'source-view';
      el.viewer.textContent = doc.text;
      el.viewer.hidden = false;
      el.outline.textContent = '';
    } else {
      el.viewer.className = 'markdown-body';
      el.viewer.innerHTML = res.html;
      el.viewer.hidden = false;
      fixImages(doc);
      wireCodeCopy();
      buildOutline(res.toc);
      $$('.task input', el.viewer).forEach(function (cb) { cb.disabled = true; });
    }

    el.docTitle.textContent = doc.name;
    el.docTitle.title = doc.path;
    document.title = doc.name + ' · MD 预览器';

    var parts = [];
    var dir = dirOf(doc.path);
    if (dir) { parts.push(dir.replace(/\/$/, '')); }
    parts.push(formatSize(doc.size));
    parts.push(doc.text.length.toLocaleString('zh-CN') + ' 字符');
    parts.push(res.toc.length + ' 个标题');
    el.docMeta.textContent = parts.join(' · ');

    el.content.scrollTop = 0;
    requestAnimationFrame(updateSpy);
  }

  function $$(sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }

  function fixImages(doc) {
    var baseDir = dirOf(doc.path);
    $$('img', el.viewer).forEach(function (img) {
      var raw = img.getAttribute('src') || '';
      if (/^(https?:|data:|blob:|file:|\/\/)/i.test(raw)) { return; }
      var clean = raw.replace(/[?#].*$/, '');
      try { clean = decodeURIComponent(clean); } catch (e) {}
      var key = normalizePath(baseDir + clean.replace(/^\.\//, ''));

      var file = state.imageMap.get(key);
      if (!file) {
        var parts = key.split('/');
        for (var k = 1; k < parts.length && !file; k++) {
          file = state.imageMap.get(parts.slice(k).join('/'));
        }
      }
      if (!file) {
        var base = key.split('/').pop();
        file = state.imageMap.get('@' + base);
      }
      if (file) { img.src = URL.createObjectURL(file); }
      else {
        img.title = '找不到图片：' + raw;
        img.classList.add('img-missing');
      }
    });
  }

  function wireCodeCopy() {
    $$('.code-block', el.viewer).forEach(function (block) {
      var btn = block.querySelector('.code-copy');
      var code = block.querySelector('pre code');
      if (!btn || !code) { return; }
      btn.addEventListener('click', function () {
        var text = code.innerText;
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(function () { say('代码已复制'); },
            function () { fallbackCopy(text); });
        } else {
          fallbackCopy(text);
        }
      });
    });
  }

  function fallbackCopy(text) {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); say('代码已复制'); } catch (e) { say('复制失败'); }
    document.body.removeChild(ta);
  }

  /* ---------- 大纲 / 滚动定位 ---------- */

  function buildOutline(toc) {
    el.outline.textContent = '';
    state.heads = [];
    if (!toc.length) {
      var none = document.createElement('div');
      none.className = 'outline-empty';
      none.textContent = '（没有标题）';
      el.outline.appendChild(none);
      return;
    }
    toc.forEach(function (h) {
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'outline-item lv' + h.level;
      btn.textContent = h.text || '(无标题)';
      btn.title = h.text || '';
      btn.dataset.target = h.id;
      btn.addEventListener('click', function () {
        var node = el.viewer.querySelector('[id="' + (window.CSS && CSS.escape ? CSS.escape(h.id) : h.id.replace(/"/g, '')) + '"]');
        if (node) {
          node.scrollIntoView({ behavior: 'smooth', block: 'start' });
          setActiveOutline(h.id);
        }
      });
      el.outline.appendChild(btn);
    });
    requestAnimationFrame(function () { collectHeads(toc); });
  }

  function collectHeads(toc) {
    state.heads = toc.map(function (h) {
      return el.viewer.querySelector('[id="' + (window.CSS && CSS.escape ? CSS.escape(h.id) : h.id.replace(/"/g, '')) + '"]');
    }).filter(Boolean);
    updateSpy();
  }

  function setActiveOutline(id) {
    $$('.outline-item', el.outline).forEach(function (b) {
      b.classList.toggle('active', b.dataset.target === id);
    });
    var active = el.outline.querySelector('.outline-item.active');
    if (active && el.outline.scrollHeight > el.outline.clientHeight) {
      var top = active.offsetTop;
      if (top < el.outline.scrollTop || top > el.outline.scrollTop + el.outline.clientHeight - 30) {
        el.outline.scrollTop = Math.max(0, top - el.outline.clientHeight / 2);
      }
    }
  }

  var spyTick = false;
  function updateSpy() {
    if (spyTick || !state.heads.length) { return; }
    spyTick = true;
    requestAnimationFrame(function () {
      spyTick = false;
      if (!state.heads.length) { return; }
      var anchor = el.content.getBoundingClientRect().top + 90;
      var currentId = state.heads[0].id;
      for (var i = 0; i < state.heads.length; i++) {
        if (state.heads[i].getBoundingClientRect().top <= anchor) { currentId = state.heads[i].id; }
        else { break; }
      }
      setActiveOutline(currentId);
    });
  }

  /* ---------- 空状态 ---------- */

  function updateEmptyState() {
    var hasDoc = state.current >= 0 && state.docs[state.current];
    el.empty.hidden = !!hasDoc;
    el.viewer.hidden = !hasDoc;
    if (!hasDoc) {
      el.docTitle.textContent = '未打开文件';
      el.docMeta.textContent = '把 .md 文件拖进来，或点击「打开文件」';
      document.title = 'MD 预览器';
    }
  }

  /* ---------- 事件绑定 ---------- */

  function bind() {
    el.toast = document.createElement('div');
    el.toast.className = 'toast';
    document.body.appendChild(el.toast);

    el.btnOpen.addEventListener('click', function () { el.fileInput.click(); });
    el.btnOpen2.addEventListener('click', function () { el.fileInput.click(); });
    el.btnFolder.addEventListener('click', function () { el.dirInput.click(); });
    el.btnFolder2.addEventListener('click', function () { el.dirInput.click(); });

    el.fileInput.addEventListener('change', function () {
      addItems(itemsFromInput(this.files));
      this.value = '';
    });
    el.dirInput.addEventListener('change', function () {
      addItems(itemsFromInput(this.files));
      this.value = '';
    });

    el.fileFilter.addEventListener('input', function () {
      state.filter = this.value;
      renderFileList();
    });

    el.themeBtn.addEventListener('click', function () {
      var order = ['auto', 'light', 'dark'];
      applyTheme(order[(order.indexOf(state.theme) + 1) % order.length]);
      say('主题：' + (state.theme === 'auto' ? '跟随系统' : state.theme === 'dark' ? '深色' : '浅色'));
    });

    el.srcBtn.addEventListener('click', toggleSource);
    el.btnFontDec.addEventListener('click', function () { applyFontSize(state.fontSize - 1); });
    el.btnFontInc.addEventListener('click', function () { applyFontSize(state.fontSize + 1); });
    el.printBtn.addEventListener('click', function () { window.print(); });

    el.content.addEventListener('scroll', updateSpy, { passive: true });
    window.addEventListener('resize', updateSpy);

    // 拖放
    var dragDepth = 0;
    document.addEventListener('dragenter', function (e) {
      e.preventDefault();
      dragDepth++;
      document.body.classList.add('dragging');
    });
    document.addEventListener('dragover', function (e) { e.preventDefault(); });
    document.addEventListener('dragleave', function (e) {
      e.preventDefault();
      dragDepth = Math.max(0, dragDepth - 1);
      if (dragDepth === 0) { document.body.classList.remove('dragging'); }
    });
    document.addEventListener('drop', function (e) {
      e.preventDefault();
      dragDepth = 0;
      document.body.classList.remove('dragging');
      var dt = e.dataTransfer;
      if (!dt) { return; }
      itemsFromDrop(dt).then(function (items) {
        if (!items.length) { say('没有识别到文件'); return; }
        addItems(items);
      }).catch(function () { say('读取拖入内容失败'); });
    });

    // 快捷键
    document.addEventListener('keydown', function (e) {
      var mod = e.ctrlKey || e.metaKey;
      if (!mod) { return; }
      var k = e.key.toLowerCase();
      if (k === 'o' && e.shiftKey) { e.preventDefault(); el.dirInput.click(); }
      else if (k === 'o') { e.preventDefault(); el.fileInput.click(); }
      else if (k === 'e') { e.preventDefault(); toggleSource(); }
      else if (k === '=' || k === '+') { e.preventDefault(); applyFontSize(state.fontSize + 1); }
      else if (k === '-') { e.preventDefault(); applyFontSize(state.fontSize - 1); }
      else if (k === '0') { e.preventDefault(); applyFontSize(16); }
    });
  }

  function toggleSource() {
    state.showSource = !state.showSource;
    el.srcBtn.classList.toggle('active', state.showSource);
    try { localStorage.setItem(K_SOURCE, state.showSource ? '1' : '0'); } catch (e) {}
    say(state.showSource ? '源码视图' : '预览视图');
    var doc = state.docs[state.current];
    if (doc && doc.text !== null) { doRender(doc); }
  }

  /* ---------- 启动 ---------- */

  function boot() {
    el.sidebar = $('#sidebar');
    el.content = $('#content');
    el.viewer = $('#viewer');
    el.empty = $('#empty');
    el.outline = $('#outline');
    el.fileList = $('#file-list');
    el.fileCount = $('#file-count');
    el.fileFilter = $('#file-filter');
    el.docTitle = $('#doc-title');
    el.docMeta = $('#doc-meta');
    el.fileInput = $('#file-input');
    el.dirInput = $('#dir-input');
    el.btnOpen = $('#btn-open');
    el.btnOpen2 = $('#btn-open2');
    el.btnFolder = $('#btn-folder');
    el.btnFolder2 = $('#btn-folder2');
    el.themeBtn = $('#btn-theme');
    el.srcBtn = $('#btn-source');
    el.btnFontDec = $('#btn-font-dec');
    el.btnFontInc = $('#btn-font-inc');
    el.printBtn = $('#btn-print');

    var theme = 'auto', font = 16, source = false;
    try { theme = localStorage.getItem(K_THEME) || 'auto'; } catch (e) {}
    try { font = parseInt(localStorage.getItem(K_FONT), 10) || 16; } catch (e) {}
    try { source = localStorage.getItem(K_SOURCE) === '1'; } catch (e) {}

    applyTheme(theme);
    applyFontSize(font);
    state.showSource = source;
    el.srcBtn.classList.toggle('active', source);

    bind();
    renderFileList();
    updateEmptyState();
    document.body.setAttribute('data-ready', '1');
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
}());

</script>
</body>
</html>
