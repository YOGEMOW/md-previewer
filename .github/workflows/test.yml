name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: 解析器单元测试
        run: node test/test-md.js

      - name: 语法检查
        run: |
          node --check src/md.js
          node --check src/app.js
          node --check src/build.js
          node --check bin/md-open.js

      - name: 重新打包单文件版
        run: node src/build.js

      - name: 检查打包产物是否为最新
        run: git diff --exit-code -- Markdown预览器.html

      - name: 界面回归测试（jsdom）
        working-directory: dev
        run: |
          npm ci --no-audit --no-fund
          node boot-test.js
